name: Loyalty web build
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/loyalty-points]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - run: node --experimental-strip-types --test tests/reward-account-phone.test.mjs
