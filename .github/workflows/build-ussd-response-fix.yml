name: Build USSD Response Fix APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ussd-response-fix.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      _JAVA_OPTIONS: -Xmx3072m -XX:MaxMetaspaceSize=1024m
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dkotlin.daemon.jvm.options=-Xmx1536m
    steps:
      - uses: actions/checkout@v4

      - name: Patch USSD response capture
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          acc = Path('android-app/app/src/main/kotlin/com/awdheegle/data/service/UssdAccessibilityService.kt')
          s = acc.read_text()

          # Preserve the proven PIN prompt wording support.
          if '"sireed"' not in s:
              s, n = re.subn(
                  r'(\s*"lambarka sirta",\n)(\s*"secret",)',
                  r'\1            "sireed",\n            "nambar sireed",\n            "nambarka sireed",\n            "lambar sireed",\n\2',
                  s,
                  count=1,
              )
              if n != 1:
                  raise SystemExit('PIN wording marker not found')

          # Move capture after the input check so menu/PIN dialogs are never saved as final results.
          pattern = re.compile(
              r'\n\s*if \(isLikelyUssdResponse\(dialogText\)\) \{\s*'
              r'saveUssdResponse\(dialogText\)\s*\}\s*'
              r'(// Direct PIN handling is only for non-planned flows\.)',
              re.S,
          )
          s, n = pattern.subn(r'\n\n            \1', s, count=1)
          if n != 1:
              raise SystemExit('early capture block not found')

          final_pattern = re.compile(
              r'(if \(interactive\) \{\s*'
              r'// Never click Send on a dialog that still expects unknown input\.\s*'
              r'return\s*\}\s*)'
              r'(clickKnownConfirmButton\(source\))',
              re.S,
          )
          s, n = final_pattern.subn(
              r'\1if (isLikelyUssdResponse(dialogText)) {\n'
              r'                saveUssdResponse(dialogText)\n'
              r'            }\n\n            \2',
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit('final capture insertion point not found')

          # Save MMI complete as terminal text, but do not treat it as delivery success.
          if '"mmi complete"' not in s:
              s, n = re.subn(r'("error",\s*)("pin")', r'\1"mmi complete", \2', s, count=1)
              if n != 1:
                  raise SystemExit('response keyword marker not found')

          acc.write_text(s)

          dial = Path('android-app/app/src/main/kotlin/com/awdheegle/data/service/UssdDialerService.kt')
          d = dial.read_text()

          # Add Somtel success spelling variants without making MMI a success.
          if '"waad ku guuleysatay"' not in d:
              d, n = re.subn(
                  r'(\s*"waad ku guulaysatay",)',
                  r'\1\n            "waad ku guuleysatay",\n            "waad ku guulaysatey",\n            "waad ku guuleysatey",\n            "ku guuleysatay",\n            "ku guulaysatay",\n            "ku guuleysatey",\n            "ku guulaysatey",',
                  d,
                  count=1,
              )
              if n != 1:
                  raise SystemExit('success marker not found')

          if 'Waiting up to 10s for USSD response capture' in d:
              d = d.replace('Waiting up to 10s for USSD response capture', 'Waiting up to 20s for USSD response capture', 1)
          else:
              raise SystemExit('wait log marker not found')

          d, n = re.subn(r'repeat\(8\) \{ attempt ->', 'repeat(18) { attempt ->', d, count=1)
          if n != 1:
              raise SystemExit('repeat marker not found')
          d, n = re.subn(r'if \(attempt < 7\) \{', 'if (attempt < 17) {', d, count=1)
          if n != 1:
              raise SystemExit('wait tail marker not found')
          dial.write_text(d)
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android-app/local.properties
          chmod +x android-app/gradlew

      - name: Build debug APK
        run: |
          set -o pipefail
          ./android-app/gradlew -p android-app clean :app:assembleDebug \
            -x test -x lint -x lintVitalAnalyzeRelease -x lintVitalReportRelease \
            --no-daemon --no-build-cache --no-configuration-cache \
            --max-workers=2 --stacktrace 2>&1 | tee gradle-build.log

      - name: Upload fixed APK
        uses: actions/upload-artifact@v4
        with:
          name: awdheegle-ussd-response-fix-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

