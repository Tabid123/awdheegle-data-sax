name: Build USSD Response Fix APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ussd-response-fix.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      _JAVA_OPTIONS: -Xmx3072m -XX:MaxMetaspaceSize=1024m
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dkotlin.daemon.jvm.options=-Xmx1536m
    steps:
      - uses: actions/checkout@v4

      - name: Patch USSD response capture
        run: |
          python3 <<'PY'
          from pathlib import Path

          acc = Path('android-app/app/src/main/kotlin/com/awdheegle/data/service/UssdAccessibilityService.kt')
          s = acc.read_text()

          # Preserve the proven *870/*866 PIN wording fix.
          pin_old = '            "lambarka sirta",\n            "secret",'
          pin_new = '            "lambarka sirta",\n            "sireed",\n            "nambar sireed",\n            "nambarka sireed",\n            "lambar sireed",\n            "secret",'
          if pin_old in s:
              s = s.replace(pin_old, pin_new, 1)

          # Do NOT save an interactive menu/PIN screen as the provider response.
          early = '''            if (isLikelyUssdResponse(dialogText)) {
                  saveUssdResponse(dialogText)
              }

              // Direct PIN handling is only for non-planned flows.'''
          replacement = '''            // Direct PIN handling is only for non-planned flows.'''
          if early not in s:
              raise SystemExit('early response-capture marker not found')
          s = s.replace(early, replacement, 1)

          # Save only after proving the final carrier dialog has no editable input.
          final_old = '''            if (interactive) {
                  // Never click Send on a dialog that still expects unknown input.
                  return
              }

              clickKnownConfirmButton(source)'''
          final_new = '''            if (interactive) {
                  // Never click Send on a dialog that still expects unknown input.
                  return
              }

              if (isLikelyUssdResponse(dialogText)) {
                  saveUssdResponse(dialogText)
              }

              clickKnownConfirmButton(source)'''
          if final_old not in s:
              raise SystemExit('final response-capture marker not found')
          s = s.replace(final_old, final_new, 1)

          # Capture Samsung's legitimate terminal MMI dialog, but classification
          # still treats MMI as ambiguous (never as automatic success).
          marker = '            "error", "pin", "furaha", "sirta", "hormuud", "somnet", "somtel"'
          marker_new = '            "error", "mmi complete", "pin", "furaha", "sirta", "hormuud", "somnet", "somtel"'
          if marker not in s:
              raise SystemExit('response keyword marker not found')
          s = s.replace(marker, marker_new, 1)
          acc.write_text(s)

          dial = Path('android-app/app/src/main/kotlin/com/awdheegle/data/service/UssdDialerService.kt')
          d = dial.read_text()

          # Somtel spelling variants seen in real successful final responses.
          success_marker = '            "waad ku guulaysatay",'
          success_repl = '''            "waad ku guulaysatay",
              "waad ku guuleysatay",
              "waad ku guulaysatey",
              "waad ku guuleysatey",
              "ku guuleysatay",
              "ku guulaysatay",
              "ku guuleysatey",
              "ku guulaysatey",'''
          if success_marker not in d:
              raise SystemExit('success marker not found')
          d = d.replace(success_marker, success_repl, 1)

          # Slow USSD final responses get roughly 20 seconds instead of 10.
          old_log = 'Waiting up to 10s for USSD response capture'
          if old_log not in d:
              raise SystemExit('wait log marker not found')
          d = d.replace(old_log, 'Waiting up to 20s for USSD response capture', 1)
          if '            repeat(8) { attempt ->' not in d:
              raise SystemExit('repeat marker not found')
          d = d.replace('            repeat(8) { attempt ->', '            repeat(18) { attempt ->', 1)
          if '                if (attempt < 7) {' not in d:
              raise SystemExit('wait tail marker not found')
          d = d.replace('                if (attempt < 7) {', '                if (attempt < 17) {', 1)
          dial.write_text(d)
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android-app/local.properties
          chmod +x android-app/gradlew

      - name: Build debug APK
        run: |
          set -o pipefail
          ./android-app/gradlew -p android-app clean :app:assembleDebug \
            -x test -x lint -x lintVitalAnalyzeRelease -x lintVitalReportRelease \
            --no-daemon --no-build-cache --no-configuration-cache \
            --max-workers=2 --stacktrace 2>&1 | tee gradle-build.log

      - name: Upload fixed APK
        uses: actions/upload-artifact@v4
        with:
          name: awdheegle-ussd-response-fix-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
