name: Build USSD Response Fix APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ussd-response-fix.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      _JAVA_OPTIONS: -Xmx3072m -XX:MaxMetaspaceSize=1024m
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dkotlin.daemon.jvm.options=-Xmx1536m
    steps:
      - uses: actions/checkout@v4

      - name: Patch USSD capture and classification
        run: |
          python3 <<'PY'
          from pathlib import Path

          acc = Path('android-app/app/src/main/kotlin/com/awdheegle/data/service/UssdAccessibilityService.kt')
          s = acc.read_text()

          # Keep the existing Hormuud/Somnet PIN wording fix in this build.
          pin_old = '            "lambarka sirta",\n            "secret",'
          pin_new = '            "lambarka sirta",\n            "sireed",\n            "nambar sireed",\n            "nambarka sireed",\n            "lambar sireed",\n            "secret",'
          if pin_old in s:
              s = s.replace(pin_old, pin_new, 1)

          # A completed *870/*866/*101 plan is allowed to persist the final
          # non-interactive phone/USSD dialog even when it only says MMI complete.
          pending_old = '''    private fun hasPendingPlan(): Boolean {
              val plan = Ussd870Flow.loadPlan(this)
              return plan.isNotEmpty() && Ussd870Flow.currentIndex(this) < plan.size
          }
          '''
          pending_new = '''    private fun hasPendingPlan(): Boolean {
              val plan = Ussd870Flow.loadPlan(this)
              return plan.isNotEmpty() && Ussd870Flow.currentIndex(this) < plan.size
          }

              private fun hasCompletedPlan(): Boolean {
                  val plan = Ussd870Flow.loadPlan(this)
                  return plan.isNotEmpty() && Ussd870Flow.currentIndex(this) >= plan.size
              }
          '''
          if pending_old not in s:
              raise SystemExit('hasPendingPlan marker not found')
          s = s.replace(pending_old, pending_new, 1)

          save_old = '''    private fun saveUssdResponse(text: String) {
              if (!isLikelyUssdResponse(text)) return
          '''
          save_new = '''    private fun saveUssdResponse(text: String, force: Boolean = false) {
              if (!force && !isLikelyUssdResponse(text)) return
          '''
          if save_old not in s:
              raise SystemExit('saveUssdResponse marker not found')
          s = s.replace(save_old, save_new, 1)

          interactive_old = '''            if (interactive) {
                  // Never click Send on a dialog that still expects unknown input.
                  return
              }

              clickKnownConfirmButton(source)
          '''
          interactive_new = '''            if (interactive) {
                  // Never click Send on a dialog that still expects unknown input.
                  return
              }

              // The planned menu/PIN flow is finished and this is a verified
              // phone/USSD window with no input. Persist exactly what the carrier
              // displayed. This covers success, explicit failure and MMI complete
              // without treating MMI complete itself as delivery success.
              if (hasCompletedPlan()) {
                  saveUssdResponse(dialogText, force = true)
              }

              clickKnownConfirmButton(source)
          '''
          if interactive_old not in s:
              raise SystemExit('final-dialog marker not found')
          s = s.replace(interactive_old, interactive_new, 1)
          acc.write_text(s)

          dial = Path('android-app/app/src/main/kotlin/com/awdheegle/data/service/UssdDialerService.kt')
          d = dial.read_text()

          # Somtel commonly writes guuleysatay/guuleysatey while the Android
          # classifier only knew the guulaysatay spelling.
          success_marker = '            "waad ku guulaysatay",'
          success_repl = '''            "waad ku guulaysatay",
              "waad ku guuleysatay",
              "waad ku guulaysatey",
              "waad ku guuleysatey",
              "ku guuleysatay",
              "ku guulaysatay",
              "ku guuleysatey",
              "ku guulaysatey",'''
          if success_marker not in d:
              raise SystemExit('success marker not found')
          d = d.replace(success_marker, success_repl, 1)

          # Give slow carrier final dialogs more time to arrive after PIN/Send.
          wait_old = '''            android.util.Log.d("UssdDialer", "⏳ Waiting up to 10s for USSD response capture (queue=$orderQueueId)...")
              delay(2000)

              repeat(8) { attempt ->'''
          wait_new = '''            android.util.Log.d("UssdDialer", "⏳ Waiting up to 20s for USSD response capture (queue=$orderQueueId)...")
              delay(2000)

              repeat(18) { attempt ->'''
          if wait_old not in d:
              raise SystemExit('response wait marker not found')
          d = d.replace(wait_old, wait_new, 1)
          if '                if (attempt < 7) {' not in d:
              raise SystemExit('response wait tail marker not found')
          d = d.replace('                if (attempt < 7) {', '                if (attempt < 17) {', 1)
          dial.write_text(d)
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android-app/local.properties
          chmod +x android-app/gradlew

      - name: Build debug APK
        run: |
          set -o pipefail
          ./android-app/gradlew -p android-app clean :app:assembleDebug \
            -x test -x lint -x lintVitalAnalyzeRelease -x lintVitalReportRelease \
            --no-daemon --no-build-cache --no-configuration-cache \
            --max-workers=2 --stacktrace 2>&1 | tee gradle-build.log

      - name: Upload fixed APK
        uses: actions/upload-artifact@v4
        with:
          name: awdheegle-ussd-response-fix-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
