name: Build Delivery Login APK

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-delivery-login-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      _JAVA_OPTIONS: -Xmx3072m -XX:MaxMetaspaceSize=1024m
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dkotlin.daemon.jvm.options=-Xmx1536m
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android-app/local.properties
          chmod +x android-app/gradlew

      - name: Build debug APK
        run: |
          set -o pipefail
          ./android-app/gradlew -p android-app clean :app:assembleDebug \
            -x test -x lint -x lintVitalAnalyzeRelease -x lintVitalReportRelease \
            --no-daemon --no-build-cache --no-configuration-cache \
            --max-workers=2 --stacktrace 2>&1 | tee gradle-build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: awdheegle-data-delivery-login-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
