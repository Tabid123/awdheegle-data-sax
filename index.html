<!doctype html>
<html lang="en">
  <head>
    <script>
      // Anti-flash + Android WebView detection (BEFORE React loads)
      (function(){
        // Anti-flash style - Najax Data purple
        var s=document.createElement('style');
        s.id='anti-flash';
        s.textContent='html,body,#root{background:#FFFFFF!important;min-height:100vh!important}';
        document.head.appendChild(s);
        
        // Detect Android WebView using User-Agent (works with Capacitor remote URL)
        var ua = navigator.userAgent || '';
        var isAndroidWebView = /Android/.test(ua) && ua.indexOf('wv') > -1;
        if (isAndroidWebView) {
          document.documentElement.style.setProperty('--effective-safe-area-top', '0px');
        } else {
          document.documentElement.style.setProperty(
            '--effective-safe-area-top', 
            'env(safe-area-inset-top, 0px)'
          );
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-visual" />

    <meta name="description" content="Awdheegle Data Services - Iibso xirmadaha internet-ka ee ugu qiimaha jaban. Waqti kasta, meel kasta.">
    <meta name="author" content="Awdheegle Data Services" />

    <meta property="og:type" content="website" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icon-192.png">

    <meta name="theme-color" content="#1370F0">
    
    <!-- Web Splash Screen Styles -->
    <style>
      :root { --effective-safe-area-top: 0px; }
      
      #initial-splash {
        position: fixed;
        inset: 0;
        background: #3D0066;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      .splash-logo {
        width: 150px;
        height: 150px;
        border-radius: 24px;
        animation: pulse 2s ease-in-out infinite;
      }
      .loading-spinner {
        width: 40px;
        height: 40px;
        margin-top: 40px;
        border: 4px solid rgba(197,248,42,0.3);
        border-top: 4px solid #C5F82A;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.9; }
      }
    </style>

  <body style="background:#FFFFFF;margin:0;padding:0;min-height:100vh;">
    <div id="root" style="background:#FFFFFF;min-height:100vh;">
      <div id="initial-splash">
        <img src="/images/najax-splash-logo.png" alt="Awdheegle Data Services" class="splash-logo" onerror="this.style.display='none'">

    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('Service Worker registered successfully:', registration);
            })
            .catch(error => {
              console.log('Service Worker registration failed:', error);
            });
        });
      }
    </script>
