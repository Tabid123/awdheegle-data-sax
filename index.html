<!doctype html>
<html lang="en">
  <head>
    <script>
      // Anti-flash + Android WebView detection (BEFORE React loads)
      (function(){
        // Anti-flash style - Awdheegle Data purple
        var s=document.createElement('style');
        s.id='anti-flash';
        s.textContent='html,body,#root{background:#0A0F2C!important;min-height:100vh!important}';
        document.head.appendChild(s);
        
        // Detect Android WebView using User-Agent (works with Capacitor remote URL)
        var ua = navigator.userAgent || '';
        var isAndroidWebView = /Android/.test(ua) && ua.indexOf('wv') > -1;
        if (isAndroidWebView) {
          document.documentElement.style.setProperty('--effective-safe-area-top', '0px');
        } else {
          document.documentElement.style.setProperty(
            '--effective-safe-area-top', 
            'env(safe-area-inset-top, 0px)'
          );
        }
      })();
    </script>

    <!-- Web Splash Screen Styles -->
    <style>
      :root { --effective-safe-area-top: 0px; }
      
      #initial-splash {
        position: fixed;
        inset: 0;
        background: radial-gradient(ellipse at center, #1E40FF 0%, #0A0F2C 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      .splash-logo {
        width: 180px;
        height: 180px;
        border-radius: 32px;
        animation: pulse 2s ease-in-out infinite;
        box-shadow: 0 20px 60px rgba(34, 197, 94, 0.35), 0 0 80px rgba(30, 64, 255, 0.4);
      }
      .loading-spinner {
        width: 40px;
        height: 40px;
        margin-top: 48px;
        border: 3px solid rgba(34, 197, 94, 0.25);
        border-top: 3px solid #22C55E;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.9; }
      }
    </style>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
